name: Deurbel bouwen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests en APK bouwen
        run: |
          chmod +x gradlew
          ./gradlew :core:test :server:test :app:assembleRelease :server:fatJar --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TapoDeurbel.apk
          cp server/build/libs/deurbel-server.jar server/docker/Dockerfile server/docker/docker-compose.yml server/docker/install.sh dist/

      - name: Docker-image thuisserver testen
        run: docker build -t deurbel-test dist

      - uses: actions/upload-artifact@v4
        with:
          name: deurbel
          path: dist/*

      - name: Downloadlink bijwerken (release "deurbel-latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deurbel-latest
          name: Deurbel-app (laatste versie)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Automatisch gebouwd van ${{ github.ref_name }} (${{ github.sha }}).
            - Android-app: download TapoDeurbel.apk op je Android-telefoon.
            - Thuisserver (iPhone + Android): op de Raspberry Pi `curl -fsSL https://github.com/${{ github.repository }}/releases/download/deurbel-latest/install.sh | bash`
          files: dist/*
