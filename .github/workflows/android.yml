name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests en APK bouwen
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk TapoDeurbel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TapoDeurbel-apk
          path: TapoDeurbel.apk

      - name: Downloadlink bijwerken (release "deurbel-latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deurbel-latest
          name: Deurbel-app (laatste versie)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "Automatisch gebouwd van ${{ github.ref_name }} (${{ github.sha }}). Download TapoDeurbel.apk en open het op je Android-telefoon."
          files: TapoDeurbel.apk
